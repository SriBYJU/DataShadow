<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="DataShadow — Functional Prototype · Public Beta. U.S. Provisional Patent Application filed August 19, 2026. A local-first personal data asset management system for consent, privacy-preserving exchange, and transparent valuation." />
  <meta name="theme-color" content="#07100e" id="themeMeta" />
  <title>DataShadow — U.S. Provisional Patent · Functional Prototype</title>
  <link rel="icon" type="image/svg+xml" href="datashadow-icon.svg" />
  <link rel="apple-touch-icon" href="datashadow-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="branding.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark brand-logo-mark"><img src="datashadow-icon.svg" alt="DataShadow"></div>
    <div class="boot-copy"><strong>DataShadow</strong><span>Initializing local privacy engine…</span></div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="brand brand-with-wordmark" data-action="nav" data-page="overview">
        <img src="datashadow-logo.svg" class="brand-wordmark-img" alt="DataShadow logo">
        <small>Personal Data OS</small>
      </div>
      <div class="patent-sidebar-badge"><b>U.S. Provisional Patent</b><small>Filed August 19, 2026</small><span>Patent Pending</span></div>

      <div class="mode-switch" role="group" aria-label="Application mode">
        <button class="mode-btn active" data-mode="personal">Personal</button>
        <button class="mode-btn" data-mode="buyer">Buyer Lab</button>
      </div>

      <nav class="side-nav" id="sideNav" aria-label="Primary navigation"></nav>

      <div class="sidebar-foot">
        <button class="sidebar-utility" data-action="guide-hub"><span>?</span> Product guide</button>
        <button class="sidebar-utility" data-action="guide"><span>↗</span> Guided tour</button>
        <button class="sidebar-utility" data-action="judge"><span>▶</span> Judge mode</button>
        <div class="local-badge"><span class="pulse-dot"></span><div><b>Local-first</b><small>Profile saved on this device</small></div></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-only" data-action="toggle-sidebar" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs" id="breadcrumbs"><span>DataShadow</span><b>/</b><strong>Overview</strong></div>
        <div class="top-actions">
          <button class="command-pill" data-action="command"><kbd>Ctrl</kbd><kbd>K</kbd><span>Search or command</span></button>
          <button class="top-guide-btn" data-action="guide-hub" aria-label="Open product guide"><span class="guide-spark">?</span><span>Guide</span></button>
          <button class="icon-btn theme-toggle" data-action="theme" aria-label="Switch light or dark mode" title="Switch theme"><span id="themeIcon">☼</span></button>
          <button class="icon-btn" data-action="notifications" aria-label="Notifications">◌<span class="notification-dot" id="notificationDot"></span></button>
          <button class="profile-chip" data-action="profile"><span class="avatar" id="avatar">SA</span><span class="profile-text"><b id="profileName">Demo Profile</b><small id="profileMeta">Local profile</small></span><span>⌄</span></button>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1"></main>
    </section>
  </div>

  <button class="assistant-fab" data-action="assistant" aria-label="Open Shadow Assistant"><span class="assistant-orb"></span><b>Shadow</b></button>

  <aside class="guide-drawer" id="guideDrawer" aria-hidden="true">
    <div class="guide-drawer-head">
      <div><small>DATASHADOW FIELD GUIDE</small><h2>Know what every tool does.</h2></div>
      <button class="icon-btn" data-action="guide-hub-close" aria-label="Close product guide">×</button>
    </div>
    <div class="guide-current" id="guideCurrent"></div>
    <div class="guide-search-wrap"><span>⌕</span><input id="guideSearch" autocomplete="off" placeholder="Search Scenario Lab, ShadowQuery, receipts…"></div>
    <div class="guide-toolbar"><button class="btn small primary" data-action="guide">Start guided tour</button><button class="btn small" data-action="nav" data-page="technology">Technical guide</button></div>
    <div class="guide-directory" id="guideDirectory"></div>
  </aside>

  <div class="drawer" id="assistantDrawer" aria-hidden="true">
    <div class="drawer-head"><div><small>CONTEXTUAL ASSISTANT</small><h2>Shadow</h2></div><button class="icon-btn" data-action="assistant-close">×</button></div>
    <div class="assistant-context" id="assistantContext"></div>
    <div class="assistant-messages" id="assistantMessages"></div>
    <div class="assistant-suggestions" id="assistantSuggestions"></div>
    <form class="assistant-input" id="assistantForm"><input id="assistantInput" autocomplete="off" placeholder="Ask about your portfolio, privacy, or a transaction…"><button>↑</button></form>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><div class="modal" id="modal"></div></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <input type="file" id="spotifyInput" accept=".json" multiple hidden>
  <input type="file" id="tiktokInput" accept=".json" hidden>
  <input type="file" id="genericInput" accept=".json,.csv" hidden>
  <input type="file" id="profileImportInput" accept=".json" hidden>

  <script src="data/public-benchmarks.js"></script>
  <script src="app.js"></script>
  <script src="site-status.js"></script>
</body>
</html>
