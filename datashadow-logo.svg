<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="title desc">
  <title id="title">DataShadow logo</title>
  <desc id="desc">DataShadow full wordmark with the DataShadow data-profile emblem.</desc>
  <defs>
    <linearGradient id="shadowGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <image href="datashadow-icon.svg" x="0" y="8" width="144" height="144" preserveAspectRatio="xMidYMid meet"/>
  <text x="158" y="101" font-family="Inter, Manrope, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">
    <tspan fill="#dbeafe">Data</tspan><tspan fill="url(#shadowGradient)">Shadow</tspan>
  </text>
</svg>